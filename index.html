    <script>
      // tema do sistema antes do primeiro desenho (sem piscar); `js` libera as animações de entrada
      (() => {
        const q = window.matchMedia('(prefers-color-scheme: dark)');
        const apply = () =>
          (document.documentElement.dataset.theme = q.matches ? 'cozy-dark' : 'cozy-light');
        apply();
        q.addEventListener('change', apply);
        document.documentElement.classList.add('js');
      })();
    </script>
